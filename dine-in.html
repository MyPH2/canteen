<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#130504">
  <title>Universal Restaurant | Dine In</title>
  <link rel="preload" href="./content.json?v=20260622-1" as="fetch" crossorigin="anonymous">
  <link rel="stylesheet" href="./styles.css?v=20260622-6">
</head>
<body class="dine-body" data-page="dine-in">
  <main class="page-shell dine-shell" data-dine-shell>
    <div class="loading-state" data-loading>
      <p class="status-note" style="color:#716158">Loading dine-in menu...</p>
    </div>

    <div class="error-state" data-error hidden></div>

    <section data-page-root hidden>
      <header class="dine-header dine-masthead">
        <a class="dine-back-link" href="./index.html">
          <span class="jump-icon" data-icon="arrow"></span>
          <span>Back to <span data-dine-brand>Universal Restaurant</span></span>
        </a>

        <div class="dine-brand-row">
          <div class="dine-brand-mark">
            <img data-dine-logo src="./assets/logo-placeholder.svg" alt="Universal Restaurant logo">
          </div>
          <div class="dine-brand-copy">
            <span>Universal Restaurant</span>
            <h1 class="dine-menu-heading">Dine In Menu</h1>
            <p>Authentic Chinese cuisine · Oranjestad, Aruba</p>
          </div>
        </div>
      </header>

      <section class="notice-card">
        <h1 data-notice-title>House Notice</h1>
        <p data-notice-body>All dine-in prices are listed in Florin. A 15% service charge will be added to your bill.</p>
      </section>

      <section class="menu-layout">
        <aside class="menu-sidebar" aria-label="Menu navigation">
          <div class="menu-group">
            <h2>Categories</h2>
            <div class="menu-switcher" data-main-categories></div>
          </div>

          <div class="menu-group" data-subnav-group>
            <h2>A La Carte</h2>
            <div class="section-switcher" data-sub-categories></div>
          </div>
        </aside>

        <div data-menu-content></div>
      </section>
    </section>
  </main>

  <script src="./site.js?v=20260622-6"></script>
</body>
</html>
